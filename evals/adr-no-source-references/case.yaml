schema_version: "1.1"
name: adr-no-source-references
expected_outcome: |
  The person summarises comparison notes kept on their own computer and asks for the ADR to link to that file. The ADR states the measurements in its own words, refers to the notes in no way, by hyperlink, path or title, and the reply tells the person the reference was left out because the notes can change or vanish without the ADR being touched.
